# CSFrace Scrape - Integration Testing Docker Compose Configuration
# Optimized for CI/CD testing with isolated ports and faster startup

networks:
  csfrace-test-network:
    driver: bridge

volumes:
  postgres-test-data:
    driver: local
  redis-test-data:
    driver: local

services:
  # Backend - Testing Configuration
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      - ENVIRONMENT=testing
      - DEBUG=false
      - LOG_LEVEL=INFO
      - SECRET_KEY=test-secret-key-for-integration-testing
      - DATABASE_URL=postgresql://postgres:test-password@postgres:5432/csfrace_test
      - REDIS_URL=redis://redis:6379/0
      - CACHE_BACKEND=redis
      - REDIS_HOST=redis
      - POSTGRES_SERVICE_NAME=postgres
      - REDIS_SERVICE_NAME=redis
      - SCRAPER_CONCURRENT_REQUESTS=5
      - SCRAPER_REQUEST_TIMEOUT=10
      - SCRAPER_MAX_RETRIES=2
      - ENABLE_CORS=true
      - CORS_ORIGINS=http://localhost:3001,http://127.0.0.1:3001
      # OAuth2 Configuration (testing defaults)
      - OAUTH_GOOGLE_CLIENT_ID=test-google-client-id
      - OAUTH_GOOGLE_CLIENT_SECRET=test-google-client-secret
      - OAUTH_GITHUB_CLIENT_ID=test-github-client-id
      - OAUTH_GITHUB_CLIENT_SECRET=test-github-client-secret
      - OAUTH_REDIRECT_URI_BASE=http://localhost:8001
      # WebAuthn Configuration
      - WEBAUTHN_RP_ID=localhost
      - WEBAUTHN_RP_NAME=CSFrace Testing
      - WEBAUTHN_ORIGIN=http://localhost:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - csfrace-test-network
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Frontend - Testing Configuration
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      - NODE_ENV=production
      - PUBLIC_API_BASE_URL=http://localhost:8001
      - SERVER_API_BASE_URL=http://backend:8000
      - PUBLIC_BACKEND_SSE_URL=http://localhost:8001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - csfrace-test-network
    restart: "no"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # PostgreSQL - Testing Database
  postgres:
    image: postgres:17.2-alpine
    environment:
      - POSTGRES_DB=csfrace_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=test-password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    networks:
      - csfrace-test-network
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d csfrace_test -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=50
      -c work_mem=4MB
      -c log_statement=none
      -c log_min_duration_statement=-1

  # Redis - Testing Cache
  redis:
    image: redis:7.4-alpine
    command: >
      redis-server
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
      --bind 0.0.0.0
      --protected-mode no
    volumes:
      - redis-test-data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    networks:
      - csfrace-test-network
    restart: "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s