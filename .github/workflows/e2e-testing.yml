name: End-to-End Workflow Testing

on:
  schedule:
    # Run E2E tests daily at 6 AM UTC
    - cron: '0 6 * * *'
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'tests/e2e/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test against'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
          - local
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - auth-flow
          - scraping-workflow
          - user-management
          - performance

env:
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

jobs:
  # E2E Test Environment Setup
  setup-e2e-environment:
    runs-on: ubuntu-latest
    outputs:
      base-url: ${{ steps.env-config.outputs.base-url }}
      api-url: ${{ steps.env-config.outputs.api-url }}
      test-environment: ${{ steps.env-config.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Test Environment
        id: env-config
        run: |
          case "${{ github.event.inputs.environment || 'local' }}" in
            "production")
              echo "base-url=https://csfrace.com" >> $GITHUB_OUTPUT
              echo "api-url=https://api.csfrace.com" >> $GITHUB_OUTPUT
              echo "environment=production" >> $GITHUB_OUTPUT
              ;;
            "staging")
              echo "base-url=https://staging.csfrace.com" >> $GITHUB_OUTPUT
              echo "api-url=https://staging-api.csfrace.com" >> $GITHUB_OUTPUT
              echo "environment=staging" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "base-url=http://localhost:3000" >> $GITHUB_OUTPUT
              echo "api-url=http://localhost:8000" >> $GITHUB_OUTPUT
              echo "environment=local" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Start Local Environment
        if: steps.env-config.outputs.environment == 'local'
        run: |
          echo "🚀 Starting local test environment..."

          # Copy environment configuration
          cp .env.example .env

          # Start services in background
          docker compose -f docker-compose.test.yml up -d --wait

          # Wait for services to be ready
          ./scripts/wait-for-services.sh

          echo "✅ Local environment ready"

  # Core E2E Test Suites
  e2e-auth-workflow:
    needs: setup-e2e-environment
    if: |
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'auth-flow' ||
      github.event.inputs.test_suite == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Start Local Services
        if: needs.setup-e2e-environment.outputs.test-environment == 'local'
        run: |
          cp .env.example .env
          docker compose -f docker-compose.test.yml up -d --wait
          ./scripts/wait-for-services.sh

      - name: Run Authentication E2E Tests
        run: |
          npx playwright test tests/e2e/auth-workflow.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.setup-e2e-environment.outputs.base-url }}
          PLAYWRIGHT_API_URL: ${{ needs.setup-e2e-environment.outputs.api-url }}
          TEST_ENVIRONMENT: ${{ needs.setup-e2e-environment.outputs.test-environment }}

      - name: Upload Auth Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-e2e-results
          path: |
            playwright-report/
            test-results/

  e2e-scraping-workflow:
    needs: setup-e2e-environment
    if: |
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'scraping-workflow' ||
      github.event.inputs.test_suite == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Start Local Services
        if: needs.setup-e2e-environment.outputs.test-environment == 'local'
        run: |
          cp .env.example .env
          docker compose -f docker-compose.test.yml up -d --wait
          ./scripts/wait-for-services.sh

      - name: Run Scraping Workflow E2E Tests
        run: |
          npx playwright test tests/e2e/scraping-workflow.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.setup-e2e-environment.outputs.base-url }}
          PLAYWRIGHT_API_URL: ${{ needs.setup-e2e-environment.outputs.api-url }}
          TEST_ENVIRONMENT: ${{ needs.setup-e2e-environment.outputs.test-environment }}

      - name: Upload Scraping Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraping-e2e-results
          path: |
            playwright-report/
            test-results/

  e2e-user-management:
    needs: setup-e2e-environment
    if: |
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'user-management' ||
      github.event.inputs.test_suite == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Start Local Services
        if: needs.setup-e2e-environment.outputs.test-environment == 'local'
        run: |
          cp .env.example .env
          docker compose -f docker-compose.test.yml up -d --wait
          ./scripts/wait-for-services.sh

      - name: Run User Management E2E Tests
        run: |
          npx playwright test tests/e2e/user-management.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.setup-e2e-environment.outputs.base-url }}
          PLAYWRIGHT_API_URL: ${{ needs.setup-e2e-environment.outputs.api-url }}
          TEST_ENVIRONMENT: ${{ needs.setup-e2e-environment.outputs.test-environment }}

      - name: Upload User Management Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-management-e2e-results
          path: |
            playwright-report/
            test-results/

  # Performance E2E Testing
  e2e-performance:
    needs: setup-e2e-environment
    if: |
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'performance' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Start Local Services
        if: needs.setup-e2e-environment.outputs.test-environment == 'local'
        run: |
          cp .env.example .env
          docker compose -f docker-compose.test.yml up -d --wait
          ./scripts/wait-for-services.sh

      - name: Run Performance E2E Tests
        run: |
          npx playwright test tests/e2e/performance.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.setup-e2e-environment.outputs.base-url }}
          PLAYWRIGHT_API_URL: ${{ needs.setup-e2e-environment.outputs.api-url }}
          TEST_ENVIRONMENT: ${{ needs.setup-e2e-environment.outputs.test-environment }}

      - name: Generate Performance Report
        run: |
          echo "📊 Performance Test Summary" > performance-summary.md
          echo "" >> performance-summary.md

          # Extract performance metrics from test results
          if [ -f "test-results/performance-metrics.json" ]; then
            echo "## Performance Metrics" >> performance-summary.md
            cat test-results/performance-metrics.json >> performance-summary.md
          fi

      - name: Upload Performance Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-e2e-results
          path: |
            playwright-report/
            test-results/
            performance-summary.md

  # Cross-Browser E2E Testing
  e2e-cross-browser:
    needs: setup-e2e-environment
    if: github.event_name == 'schedule' || github.event.inputs.test_suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start Local Services
        if: needs.setup-e2e-environment.outputs.test-environment == 'local'
        run: |
          cp .env.example .env
          docker compose -f docker-compose.test.yml up -d --wait
          ./scripts/wait-for-services.sh

      - name: Run Cross-Browser E2E Tests
        run: |
          npx playwright test --project=${{ matrix.browser }} tests/e2e/critical-paths.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.setup-e2e-environment.outputs.base-url }}
          PLAYWRIGHT_API_URL: ${{ needs.setup-e2e-environment.outputs.api-url }}
          TEST_ENVIRONMENT: ${{ needs.setup-e2e-environment.outputs.test-environment }}

      - name: Upload Cross-Browser Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-browser-${{ matrix.browser }}-results
          path: |
            playwright-report/
            test-results/

  # E2E Test Summary and Reporting
  e2e-test-summary:
    needs: [e2e-auth-workflow, e2e-scraping-workflow, e2e-user-management, e2e-performance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download All Test Results
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts/

      - name: Generate E2E Test Summary
        run: |
          echo "# End-to-End Test Summary" > e2e-summary.md
          echo "" >> e2e-summary.md
          echo "## Test Environment: ${{ needs.setup-e2e-environment.outputs.test-environment }}" >> e2e-summary.md
          echo "## Base URL: ${{ needs.setup-e2e-environment.outputs.base-url }}" >> e2e-summary.md
          echo "" >> e2e-summary.md
          echo "## Test Results" >> e2e-summary.md

          # Check test results
          if [ "${{ needs.e2e-auth-workflow.result }}" == "success" ]; then
            echo "✅ Authentication Workflow: PASSED" >> e2e-summary.md
          else
            echo "❌ Authentication Workflow: FAILED" >> e2e-summary.md
          fi

          if [ "${{ needs.e2e-scraping-workflow.result }}" == "success" ]; then
            echo "✅ Scraping Workflow: PASSED" >> e2e-summary.md
          else
            echo "❌ Scraping Workflow: FAILED" >> e2e-summary.md
          fi

          if [ "${{ needs.e2e-user-management.result }}" == "success" ]; then
            echo "✅ User Management: PASSED" >> e2e-summary.md
          else
            echo "❌ User Management: FAILED" >> e2e-summary.md
          fi

          if [ "${{ needs.e2e-performance.result }}" == "success" ]; then
            echo "✅ Performance Tests: PASSED" >> e2e-summary.md
          else
            echo "❌ Performance Tests: FAILED" >> e2e-summary.md
          fi

          echo "" >> e2e-summary.md
          echo "Generated at: $(date)" >> e2e-summary.md

      - name: Upload E2E Summary
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-summary
          path: e2e-summary.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('e2e-summary.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🎭 End-to-End Test Results\n\n${summary}`
            });

  # Cleanup Local Environment
  cleanup-local-environment:
    needs: [e2e-auth-workflow, e2e-scraping-workflow, e2e-user-management, e2e-performance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup Local Test Environment
        run: |
          echo "🧹 Cleaning up local test environment..."

          # Stop and remove containers
          docker compose -f docker-compose.test.yml down -v || true

          # Clean up Docker system
          docker system prune -af || true

          echo "✅ Cleanup completed"