name: Submodule Sync & Integration

on:
  schedule:
    # Check for submodule updates daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update all submodules'
        required: false
        default: false
        type: boolean

concurrency:
  group: submodule-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-submodule-updates:
    name: Check & Update Submodules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    
    outputs:
      backend-updated: ${{ steps.check-updates.outputs.backend-updated }}
      frontend-updated: ${{ steps.check-updates.outputs.frontend-updated }}
      updates-available: ${{ steps.check-updates.outputs.updates-available }}
    
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check for submodule updates
        id: check-updates
        run: |
          echo "🔍 Checking for submodule updates..."
          
          # Initialize tracking
          backend_updated=false
          frontend_updated=false
          updates_available=false
          
          # Check backend updates
          if [ -d "backend" ]; then
            cd backend
            git fetch origin
            local_commit=$(git rev-parse HEAD)
            remote_commit=$(git rev-parse origin/master 2>/dev/null || git rev-parse origin/main)
            
            if [ "$local_commit" != "$remote_commit" ]; then
              echo "📦 Backend updates available: $local_commit -> $remote_commit"
              backend_updated=true
              updates_available=true
            fi
            cd ..
          fi
          
          # Check frontend updates
          if [ -d "frontend" ]; then
            cd frontend
            git fetch origin
            local_commit=$(git rev-parse HEAD)
            remote_commit=$(git rev-parse origin/main 2>/dev/null || git rev-parse origin/master)
            
            if [ "$local_commit" != "$remote_commit" ]; then
              echo "🎨 Frontend updates available: $local_commit -> $remote_commit"
              frontend_updated=true
              updates_available=true
            fi
            cd ..
          fi
          
          # Set outputs
          echo "backend-updated=$backend_updated" >> $GITHUB_OUTPUT
          echo "frontend-updated=$frontend_updated" >> $GITHUB_OUTPUT
          echo "updates-available=$updates_available" >> $GITHUB_OUTPUT
          
          if [ "$updates_available" = "true" ] || [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            echo "✅ Updates will be applied"
          else
            echo "✅ No updates needed"
          fi

      - name: Update submodules
        if: steps.check-updates.outputs.updates-available == 'true' || github.event.inputs.force_update == 'true'
        run: |
          echo "🔄 Updating submodules..."
          
          # Update submodules to latest
          git submodule update --remote --merge
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "ℹ️ No submodule changes to commit"
          else
            # Create summary of changes
            echo "📝 Preparing commit with submodule updates..."
            
            backend_commit=""
            frontend_commit=""
            
            if [ -d "backend" ]; then
              cd backend
              backend_commit=$(git log -1 --format="%h %s")
              cd ..
            fi
            
            if [ -d "frontend" ]; then
              cd frontend  
              frontend_commit=$(git log -1 --format="%h %s")
              cd ..
            fi
            
            # Create detailed commit message
            commit_msg="chore(submodules): update to latest versions"
            if [ -n "$backend_commit" ]; then
              commit_msg="$commit_msg

Backend: $backend_commit"
            fi
            if [ -n "$frontend_commit" ]; then
              commit_msg="$commit_msg

Frontend: $frontend_commit"
            fi
            
            # Configure git and commit
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            git add .
            git commit -m "$commit_msg"
            git push origin ${{ github.ref_name }}
            
            echo "✅ Submodules updated and committed"
          fi

trigger-integration-tests:
    name: Trigger Integration Tests
    needs: check-submodule-updates
    runs-on: ubuntu-latest
    if: needs.check-submodule-updates.outputs.updates-available == 'true'
    
    steps:
      - name: Trigger integration workflow
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: submodule-updated
          client-payload: |
            {
              "backend_updated": "${{ needs.check-submodule-updates.outputs.backend-updated }}",
              "frontend_updated": "${{ needs.check-submodule-updates.outputs.frontend-updated }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}"
            }