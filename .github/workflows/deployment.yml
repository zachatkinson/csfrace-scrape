# ⚠️ DEPRECATED: This workflow has been replaced
#
# This workflow attempted to build Docker images from submodules, which violates
# our DRY/SOLID/SOC architecture principles.
#
# New architecture (as of 2025-10-05):
# - Individual repos (backend/frontend) build and publish their own Docker images
# - Orchestrator uses coordinated-deployment.yml to pull pre-built images and deploy
#
# Reason for deprecation:
# - Violates Separation of Concerns: Orchestrator shouldn't build, only coordinate
# - Violates DRY: Duplicates build logic from individual repos
# - Permission issues: Orchestrator can't create packages for submodules
#
# Use instead:
# - .github/workflows/coordinated-deployment.yml (orchestrator deployment)
# - backend/.github/workflows/release.yml (backend build & publish)
# - frontend/.github/workflows/release.yml (frontend build & publish)
#
# Deprecated on: 2025-10-05
# Replaced by: .github/workflows/coordinated-deployment.yml
# Backup: .github/workflows/deployment.yml.deprecated-20251005

name: 🚫 DEPRECATED - Deployment Gates & Environment Promotion

on:
  workflow_dispatch:
    inputs:
      confirm-deprecated:
        description: 'This workflow is DEPRECATED. Use coordinated-deployment.yml instead.'
        required: true
        type: boolean
        default: false

jobs:
  deprecation-notice:
    name: ⚠️ Deprecation Notice
    runs-on: ubuntu-latest
    steps:
      - name: Show deprecation notice
        run: |
          echo "::error title=Workflow Deprecated::This workflow has been deprecated and replaced"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ⚠️ This Workflow is Deprecated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This workflow violated our DRY/SOLID/SOC architecture principles." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### New Architecture" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **Individual repos** (backend/frontend): Build and publish Docker images" >> $GITHUB_STEP_SUMMARY
          echo "2. **Orchestrator**: Pull pre-built images and coordinate deployment" >> $GITHUB_STEP_SUMMARY
          echo "3. **Orchestrator**: Run integration tests before production" >> $GITHUB_STEP_SUMMARY
          echo "4. **Orchestrator**: Monitor all services together" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Use These Workflows Instead" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Orchestrator deployment:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`.github/workflows/coordinated-deployment.yml\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend build & publish:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`backend/.github/workflows/release.yml\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend build & publish:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`frontend/.github/workflows/release.yml\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Why This Was Deprecated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Violated Separation of Concerns" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Duplicated build logic from individual repos" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Permission issues: Can't create packages for submodules" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Built images from orchestrator (wrong!)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Documentation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See \`DEPLOYMENT_ARCHITECTURE.md\` for complete architecture details." >> $GITHUB_STEP_SUMMARY
          exit 1
