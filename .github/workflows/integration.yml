name: Integration Tests & Cross-Service Validation

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose*.yml'
      - 'Dockerfile*'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose*.yml'
      - 'Dockerfile*'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api_contracts
          - e2e
          - performance

env:
  COMPOSE_PROJECT_NAME: csfrace-integration
  BACKEND_PORT: 8001
  FRONTEND_PORT: 3001
  POSTGRES_PORT: 5433
  REDIS_PORT: 6380

jobs:
  # Change Detection for Intelligent CI
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      docker: ${{ steps.changes.outputs.docker }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            docker:
              - 'docker-compose*.yml'
              - '**/Dockerfile*'
            workflows:
              - '.github/workflows/**'

  # API Contract Validation
  api-contract-validation:
    needs: detect-changes
    if: github.ref == 'refs/heads/master' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install API testing dependencies
        run: |
          npm install -g newman @apidevtools/swagger-cli
          npm install

      - name: Start services for API testing
        run: |
          cp .env.example .env
          docker compose -f docker-compose.test.yml up -d --wait || {
            echo "::error::Docker compose failed to start services"
            echo "Frontend logs:"
            docker compose -f docker-compose.test.yml logs frontend
            echo "Backend logs:"
            docker compose -f docker-compose.test.yml logs backend
            exit 1
          }
        timeout-minutes: 5

      - name: Install service health check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools postgresql-client

      - name: Wait for services to be ready
        run: |
          chmod +x scripts/wait-for-services.sh
          ./scripts/wait-for-services.sh

      - name: Validate OpenAPI Schema
        run: |
          # Download and validate backend OpenAPI schema
          curl -f http://localhost:${BACKEND_PORT}/openapi.json > backend-schema.json
          swagger-cli validate backend-schema.json

      - name: Run API Contract Tests
        run: |
          # Test critical API endpoints
          newman run tests/api-contracts/postman-collection.json \
            --environment tests/api-contracts/integration-environment.json \
            --reporters cli,json \
            --reporter-json-export api-test-results.json

      - name: Upload API test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-contract-results
          path: api-test-results.json

  # Cross-Service Integration Tests
  integration-tests:
    needs: detect-changes
    if: github.ref == 'refs/heads/master' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        test-suite:
          - auth-flow
          - health-monitoring
          - real-time-updates

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install
          pip install playwright pytest-asyncio httpx websockets
          npx playwright install --with-deps chromium  # Node.js Playwright
          playwright install chromium  # Python Playwright

      - name: Install service health check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools postgresql-client

      - name: Start full service stack
        run: |
          cp .env.example .env
          docker compose -f docker-compose.test.yml up -d --wait || {
            echo "::error::Docker compose failed to start services"
            echo "Frontend logs:"
            docker compose -f docker-compose.test.yml logs frontend
            echo "Backend logs:"
            docker compose -f docker-compose.test.yml logs backend
            exit 1
          }
          ./scripts/wait-for-services.sh
        timeout-minutes: 10

      - name: Run Integration Test Suite - ${{ matrix.test-suite }}
        run: |
          case "${{ matrix.test-suite }}" in
            "auth-flow")
              pytest tests/integration/test_auth_flow.py -v --tb=short
              ;;
            "health-monitoring")
              pytest tests/integration/test_health_monitoring.py -v --tb=short
              ;;
            "real-time-updates")
              pytest tests/integration/test_realtime_updates.py -v --tb=short
              ;;
          esac

      - name: Collect service logs on failure
        if: failure()
        run: |
          mkdir -p logs
          docker compose -f docker-compose.test.yml logs backend > logs/backend.log
          docker compose -f docker-compose.test.yml logs frontend > logs/frontend.log
          docker compose -f docker-compose.test.yml logs postgres > logs/postgres.log
          docker compose -f docker-compose.test.yml logs redis > logs/redis.log

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: service-logs-${{ matrix.test-suite }}
          path: logs/

  # End-to-End Workflow Tests
  e2e-tests:
    needs: [detect-changes, api-contract-validation]
    if: github.ref == 'refs/heads/master' || needs.detect-changes.outputs.frontend == 'true' || github.event.inputs.test_type == 'e2e' || github.event.inputs.test_type == 'all'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps

      - name: Install service health check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools postgresql-client

      - name: Start production-like environment
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml up -d --wait
          ./scripts/wait-for-services.sh
        timeout-minutes: 10

      - name: Run E2E Tests
        run: |
          npx playwright test --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Integration Test Summary
  integration-summary:
    needs: [api-contract-validation, integration-tests, e2e-tests]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate Integration Report
        run: |
          echo "# Integration Test Summary" > integration-report.md
          echo "" >> integration-report.md
          echo "## Test Results" >> integration-report.md

          if [ "${{ needs.api-contract-validation.result }}" == "success" ]; then
            echo "✅ API Contract Validation: PASSED" >> integration-report.md
          else
            echo "❌ API Contract Validation: FAILED" >> integration-report.md
          fi

          if [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "✅ Integration Tests: PASSED" >> integration-report.md
          else
            echo "❌ Integration Tests: FAILED" >> integration-report.md
          fi

          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "✅ E2E Tests: PASSED" >> integration-report.md
          else
            echo "❌ E2E Tests: FAILED" >> integration-report.md
          fi

          echo "" >> integration-report.md
          echo "Generated at: $(date)" >> integration-report.md

      - name: Upload Integration Report
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: integration-report.md