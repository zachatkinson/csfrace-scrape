name: Integration Testing

on:
  push:
    branches: [master, main]
    paths:
      - 'docker compose*.yml'
      - '.env.example'
      - 'monitoring/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'docker compose*.yml'
      - '.env.example'
      - 'monitoring/**'
      - 'scripts/**'
      - '.github/workflows/**'
  # Trigger when submodules are updated
  repository_dispatch:
    types: [backend-updated, frontend-updated]
  # Manual trigger for full integration testing
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of integration test'
        required: true
        default: 'full'
        type: choice
        options:
        - full
        - backend-only
        - frontend-only
        - monitoring-only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: csfrace-scrape-test

jobs:
  # Validate Docker Compose Configuration
  compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false  # Don't need submodules for config validation
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate production compose file
        run: |
          echo "🔍 Validating docker-compose.yml..."
          docker compose -f docker-compose.yml config --quiet
          echo "✅ Production compose file is valid"
          
      - name: Validate development compose file
        run: |
          echo "🔍 Validating docker-compose.dev.yml..."
          docker compose -f docker-compose.dev.yml config --quiet
          echo "✅ Development compose file is valid"

      - name: Check environment template
        run: |
          echo "🔍 Checking .env.example for essential user configuration..."
          if [ -f .env.example ]; then
            # Define essential variables that users MUST configure
            # These are variables without sensible defaults that users need to set
            essential_vars="
              BACKEND_PORT
              FRONTEND_PORT
              POSTGRES_PASSWORD
              POSTGRES_DB
              POSTGRES_USER
              ENVIRONMENT
              COMPOSE_PROJECT_NAME
            "
            
            missing_essential=""
            for var in $essential_vars; do
              if [ -n "$var" ] && ! grep -q "^$var=" .env.example; then
                missing_essential="$missing_essential $var"
              fi
            done
            
            if [ -n "$missing_essential" ]; then
              echo "❌ Missing essential variables in .env.example:$missing_essential"
              echo "💡 These variables require user configuration and should be documented."
              exit 1
            else
              echo "✅ Essential user configuration variables are documented"
            fi
            
            # Check that .env.example exists and is not empty
            if [ ! -s .env.example ]; then
              echo "⚠️ .env.example is empty - should contain configuration examples"
              exit 1
            fi
            
            echo "📋 Found $(grep -c '^[A-Z]' .env.example) configuration variables in .env.example"
          else
            echo "❌ No .env.example file found - users need configuration guidance"
            exit 1
          fi

  # Integration Test with Mock Services
  integration-test:
    name: Service Integration Test
    runs-on: ubuntu-latest
    needs: compose-validation
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up test environment
        run: |
          # Create test environment file
          cp .env.example .env
          
          # Override with test-specific values
          cat >> .env << EOF
          ENVIRONMENT=test
          BACKEND_PORT=8000
          FRONTEND_PORT=3000
          POSTGRES_PASSWORD=test_password
          GRAFANA_ADMIN_PASSWORD=test_password
          EOF

      - name: Start core services (database, cache)
        run: |
          echo "🚀 Starting core services..."
          docker compose up -d postgres redis
          
          echo "⏳ Waiting for services to be healthy..."
          timeout 60s bash -c 'until docker compose ps | grep -E "(postgres|redis)" | grep -q "healthy"; do sleep 5; done'
          
          echo "✅ Core services are running"

      - name: Verify service health
        run: |
          echo "🔍 Checking service health..."
          
          # Check PostgreSQL
          docker compose exec -T postgres pg_isready -U postgres
          
          # Check Redis
          docker compose exec -T redis redis-cli ping
          
          echo "✅ All core services are healthy"

      - name: Test service networking
        run: |
          echo "🌐 Testing service networking..."
          
          # Test PostgreSQL connectivity from another container
          docker run --rm --network csfrace-scrape-test_csfrace-network \
            -e PGPASSWORD=test_password \
            postgres:15-alpine \
            psql -h postgres -U postgres -d csfrace -c "SELECT 1;"
          
          # Test Redis connectivity
          docker run --rm --network csfrace-scrape-test_csfrace-network \
            redis:7-alpine \
            redis-cli -h redis ping
          
          echo "✅ Service networking is working"

      - name: Test monitoring stack (if enabled)
        run: |
          echo "📊 Testing monitoring services..."
          
          # Start monitoring services
          docker compose --profile monitoring up -d prometheus-dev grafana-dev
          
          # Wait for services
          timeout 60s bash -c 'until curl -sf http://localhost:9090/-/healthy; do sleep 5; done'
          timeout 60s bash -c 'until curl -sf http://localhost:3001/api/health; do sleep 5; done'
          
          echo "✅ Monitoring stack is working"

      - name: Cleanup test environment
        if: always()
        run: |
          echo "🧹 Cleaning up test environment..."
          docker compose down -v
          docker system prune -f
          echo "✅ Cleanup completed"

  # Security Scan for Docker Compose
  security-scan:
    name: Docker Compose Security Scan
    runs-on: ubuntu-latest
    needs: compose-validation
    timeout-minutes: 10
    permissions:
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Trivy security scan on Docker Compose
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Run Hadolint on Dockerfiles (if any exist)
        run: |
          echo "🔍 Scanning for Dockerfiles to lint..."
          if find . -name "Dockerfile" -type f | grep -q .; then
            echo "✅ Found Dockerfiles, running Hadolint..."
            # Use Hadolint container directly since we don't have Dockerfiles in umbrella repo
            docker run --rm -i hadolint/hadolint:latest hadolint - < backend/Dockerfile > hadolint-output.txt || echo "No backend Dockerfile found"
            echo "📝 Hadolint scan completed (container security handled by submodule repos)"
          else
            echo "ℹ️ No Dockerfiles in umbrella repo - container security handled by backend/frontend submodules"
          fi
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-config-results.sarif'
          category: 'trivy-config'

      # Note: Hadolint scanning handled by individual backend/frontend repos
      # Umbrella repo focuses on Docker Compose orchestration security

      - name: Check for secrets in configuration
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --only-verified