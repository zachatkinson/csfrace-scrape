name: 🐛 Bug Report
description: Report a bug in the CSFrace Scrape wrapper orchestration
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: ["zachatkinson"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! This form is for issues with the **wrapper orchestration** (Docker, services coordination, environment setup).
        
        For component-specific issues:
        - **Backend Issues**: [csfrace-scrape-back repository](https://github.com/zachatkinson/csfrace-scrape-back/issues)
        - **Frontend Issues**: [csfrace-scrape-front repository](https://github.com/zachatkinson/csfrace-scrape-front/issues)

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the wrapper is affected?
      options:
        - Docker Compose orchestration
        - Environment configuration
        - Service networking
        - Monitoring/Grafana setup
        - Submodule management
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of the bug
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue
      placeholder: |
        1. Start services with `docker compose up -d`
        2. Run command `...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your development environment details
      placeholder: |
        - OS: [e.g., macOS, Windows, Ubuntu]
        - Docker version: [e.g., 20.10.17]
        - Docker Compose version: [e.g., 2.10.2]
        - Git version: [e.g., 2.37.0]
      render: markdown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs/Output
      description: Relevant logs or error output
      placeholder: |
        ```
        Paste logs here
        ```
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the problem
      placeholder: Screenshots, related issues, workarounds tried, etc.