# CSFrace Scrape - Production Docker Compose Configuration
# This orchestrates the backend scraper and frontend interface

networks:
  csfrace-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

services:
  # Backend - Python FastAPI Scraper (Production Distroless)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production  # Uses production stage with proper CMD
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Core Settings
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${BACKEND_LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:-b18939e378f6b5e6c6f2ac8a7b3ee49eb3f5d6a909902abbdb4358a4093e2900}
      
      # Database Configuration
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-csfrace}
      - POSTGRES_SERVICE_NAME=postgres
      - POSTGRES_DATABASE=${POSTGRES_DB:-csfrace}
      
      # Redis Configuration  
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_SERVICE_NAME=redis
      - CACHE_BACKEND=redis
      
      # Scraper Configuration
      - SCRAPER_CONCURRENT_REQUESTS=${SCRAPER_CONCURRENT_REQUESTS:-10}
      - SCRAPER_REQUEST_TIMEOUT=${SCRAPER_REQUEST_TIMEOUT:-30}
      - SCRAPER_MAX_RETRIES=${SCRAPER_MAX_RETRIES:-3}
      
      # CORS Configuration
      - ENABLE_CORS=${ENABLE_CORS:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3010}
      
      # OAuth2 Configuration (using Docker interpolation with defaults)
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
      - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
      - OAUTH_MICROSOFT_CLIENT_ID=${OAUTH_MICROSOFT_CLIENT_ID:-your-microsoft-client-id}
      - OAUTH_MICROSOFT_CLIENT_SECRET=${OAUTH_MICROSOFT_CLIENT_SECRET:-your-microsoft-client-secret}
      - OAUTH_FACEBOOK_CLIENT_ID=${OAUTH_FACEBOOK_CLIENT_ID:-your-facebook-app-id}
      - OAUTH_FACEBOOK_CLIENT_SECRET=${OAUTH_FACEBOOK_CLIENT_SECRET:-your-facebook-app-secret}
      - OAUTH_APPLE_CLIENT_ID=${OAUTH_APPLE_CLIENT_ID:-your-apple-service-id}
      - OAUTH_APPLE_CLIENT_SECRET=${OAUTH_APPLE_CLIENT_SECRET:-your-apple-client-secret}
      - OAUTH_REDIRECT_URI_BASE=${OAUTH_REDIRECT_URI_BASE:-http://localhost:8000}
      - FORCE_SECURE_COOKIES=${FORCE_SECURE_COOKIES:-false}

      # Auth Token Configuration
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      
      # WebAuthn Configuration
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-CSFrace Backend}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - csfrace-network
    restart: ${RESTART_POLICY:-unless-stopped}
    # Note: Distroless images don't have curl, using venv Python health check
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-2g}
          cpus: '2.0'
        reservations:
          memory: 512m
          cpus: '0.5'

  # Frontend - React/TypeScript Interface
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3010}:3000"
    environment:
      - NODE_ENV=production
      # Astro will automatically load .env.production file
      # Override specific variables if needed for different deployments
      - SERVER_API_BASE_URL=${FRONTEND_SERVER_API_URL:-http://backend:8000}  # Server-side uses internal Docker network
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-https://localhost}  # Client-side uses nginx reverse proxy (port 443)
    extra_hosts:
      # Docker best practice: enable host.docker.internal for server-side authentication
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - csfrace-network
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEMORY_LIMIT:-1g}
          cpus: '1.0'
        reservations:
          memory: 256m
          cpus: '0.25'

  # PostgreSQL Database
  postgres:
    image: postgres:17.2-alpine  # Pin specific version as per official best practices
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-csfrace}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      # Use _FILE suffix for production secrets as recommended by official docs
      - POSTGRES_PASSWORD_FILE=${POSTGRES_PASSWORD_FILE:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C --data-checksums
      # Production performance settings following official recommendations
      - POSTGRES_SHARED_PRELOAD_LIBRARIES=pg_stat_statements
    volumes:
      # Official recommendation: mount data to /var/lib/postgresql/data
      - postgres-data:/var/lib/postgresql/data
      # Official recommendation: place init scripts in /docker-entrypoint-initdb.d/
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - csfrace-network
    restart: ${RESTART_POLICY:-unless-stopped}
    # Official recommendation: use pg_isready for health checks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-csfrace} -h localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # PostgreSQL production tuning following official performance guidelines
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c wal_buffers=16MB
      -c checkpoint_timeout=15min
      -c max_wal_size=2GB
      -c min_wal_size=1GB
      -c log_statement=ddl
      -c log_min_duration_statement=1000
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
      -c shared_preload_libraries=pg_stat_statements
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-2g}
          cpus: '1.0'
        reservations:
          memory: 512m
          cpus: '0.25'

  # Redis Cache
  redis:
    image: redis:7.4-alpine  # Pin to specific version as per official best practices
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --save 900 1 60 1000 5 10000
      --bind 0.0.0.0
      --protected-mode no
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - csfrace-network
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-768m}  # Increased for overhead
          cpus: '0.5'
        reservations:
          memory: 128m
          cpus: '0.1'

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.40.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      - '--web.enable-lifecycle'
    networks:
      - csfrace-network
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - Monitoring Dashboard  
  grafana:
    image: grafana/grafana-enterprise:11.3.0  # Official recommendation: use grafana-enterprise
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      # Security configuration following official best practices
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ACCESS:-false}
      # Plugin installation as recommended by official docs
      - GF_INSTALL_PLUGINS=${GRAFANA_PLUGINS:-grafana-piechart-panel,grafana-worldmap-panel}
      # Performance and logging
      - GF_LOG_LEVEL=${GRAFANA_LOG_LEVEL:-info}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      # Official recommendation: use named volumes for persistent storage
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - csfrace-network
    restart: ${RESTART_POLICY:-unless-stopped}
    # Official recommendation: health check via API
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-1g}
          cpus: '0.5'
        reservations:
          memory: 256m
          cpus: '0.1'

  # Nginx Reverse Proxy (CRITICAL: Required for routing and CORS)
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - csfrace-network
    restart: ${RESTART_POLICY:-unless-stopped}
    # REMOVED profiles restriction - nginx is ESSENTIAL for routing