# CSFrace Nginx Reverse Proxy Configuration
# Unified configuration for both development and production environments
# Solves cross-origin cookie blocking by unifying frontend and backend under single origin
# Based on: https://alexduggleby.com/blog/adding-reverse-proxy-for-astro-sites-on-cloudflare-pages/

events {
    worker_connections 1024;
}

http {
    # Basic HTTP configuration
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WebSocket connection upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # OAuth callback routing: JSON requests → backend, HTML requests → frontend
    # Map checks if Accept header contains "json" anywhere (case-insensitive)
    map $http_accept $oauth_backend {
        default "frontend:3000";
        "~*json" "backend:8000";
    }

    # Logging configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Dynamic upstream resolution with lazy resolution to avoid startup DNS issues
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        listen 443 ssl;
        server_name localhost;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/localhost.crt;
        ssl_certificate_key /etc/nginx/ssl/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CRITICAL: Cookie forwarding configuration for Docker environments
        # Official nginx docs recommendation for container-to-browser cookie rewriting
        # This ensures cookies set by backend are properly transmitted to frontend
        proxy_cookie_domain backend localhost;
        proxy_cookie_path / /;

        # Safari-compatible cookie configuration
        # Backend handles Secure flag based on X-Forwarded-Proto detection
        # IMPORTANT: Don't override Secure flag - backend handles this based on X-Forwarded-Proto
        # proxy_cookie_flags ~ samesite=lax secure;  # DISABLED - backend sets this

        # Proxy headers for proper request forwarding
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # SSE endpoints - Optimized for Server-Sent Events
        location ~ ^/(api/performance|api/sse|api/events/stream|stream|jobs/stream|health/stream|performance/stream) {
            # CRITICAL: Preserve cookies for authentication
            proxy_pass_request_headers on;
            proxy_set_header Cookie $http_cookie;

            # Use lazy DNS resolution to avoid startup issues
            set $backend_host backend;
            set $backend_port 8000;
            proxy_pass http://$backend_host:$backend_port;

            # SSE-specific configuration following nginx official docs
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;

            # Extended timeouts for SSE streams
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            # SSE headers
            add_header Cache-Control "no-cache" always;
            add_header X-Accel-Buffering "no" always;

            # CORS headers for SSE
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With, Cache-Control" always;
        }

        # Health endpoint (exact match to prevent redirects)
        location = /health {
            # CRITICAL: Preserve cookies for authentication
            proxy_pass_request_headers on;
            proxy_set_header Cookie $http_cookie;

            # Use lazy DNS resolution
            set $backend_host backend;
            set $backend_port 8000;
            proxy_pass http://$backend_host:$backend_port/health/;

            # CORS headers
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With, X-CSRF-Token" always;

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With, X-CSRF-Token" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer settings
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # OAuth callback routes - Smart routing based on Accept header
        # Browser navigation (text/html) → Frontend gradient page
        # JavaScript fetch (application/json) → Backend API
        location ~ ^/auth/oauth/.*/callback {
            # Use map to determine target based on Accept header
            proxy_pass http://$oauth_backend;
            resolver 127.0.0.11 valid=30s ipv6=off;

            # Common headers
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Backend-specific: preserve cookies
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_headers on;

            # CORS headers for API requests
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With, X-CSRF-Token" always;
            add_header Access-Control-Expose-Headers "Set-Cookie" always;

            # WebSocket support for frontend
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer settings
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Job list and creation endpoints - /jobs and /jobs/ (with or without query params)
        # Match: /jobs, /jobs/, /jobs?params, /jobs/?params
        # Note: Query strings are automatically excluded from nginx location matching
        location ~ ^/jobs/?$ {
            # CRITICAL: Preserve cookies for authentication
            proxy_pass_request_headers on;
            proxy_set_header Cookie $http_cookie;

            # CRITICAL: Proxy headers for proper request forwarding
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Use lazy DNS resolution
            set $backend_host backend;
            set $backend_port 8000;
            proxy_pass http://$backend_host:$backend_port;

            # CORS headers
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With, X-CSRF-Token" always;
            add_header Access-Control-Expose-Headers "Set-Cookie" always;

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With, X-CSRF-Token" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer settings
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Job CRUD endpoints - /jobs/{uuid} (exact UUID format, excludes /jobs/stream)
        location ~ "^/jobs/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(/|$)" {
            # CRITICAL: Preserve cookies for authentication
            proxy_pass_request_headers on;
            proxy_set_header Cookie $http_cookie;

            # CRITICAL: Proxy headers for proper request forwarding
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Use lazy DNS resolution
            set $backend_host backend;
            set $backend_port 8000;
            proxy_pass http://$backend_host:$backend_port;

            # CORS headers
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With, X-CSRF-Token" always;
            add_header Access-Control-Expose-Headers "Set-Cookie" always;

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer settings
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Backend API routes - /api/*, /auth/* (except OAuth callbacks), /openapi.json, /docs
        location ~ ^/(api|auth|openapi\.json|docs) {
            # CRITICAL: Preserve cookies for authentication
            proxy_pass_request_headers on;
            proxy_set_header Cookie $http_cookie;

            # CRITICAL: Proxy headers for proper request forwarding (must be in each location block)
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Use lazy DNS resolution to avoid startup issues
            # Force nginx to resolve the hostname at request time, not at startup
            set $backend_host backend;
            set $backend_port 8000;
            proxy_pass http://$backend_host:$backend_port;

            # CORS headers
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With, X-CSRF-Token" always;
            add_header Access-Control-Expose-Headers "Set-Cookie" always;

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
                add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With, X-CSRF-Token" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer settings
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Frontend routes - everything else goes to frontend
        location / {
            # Use lazy DNS resolution to avoid startup issues
            set $frontend_host frontend;
            set $frontend_port 3000;
            proxy_pass http://$frontend_host:$frontend_port;

            # WebSocket support for Astro dev server
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer settings for real-time updates
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Health check endpoint for nginx itself
        location /nginx-health {
            access_log off;
            return 200 "nginx healthy\n";
            add_header Content-Type text/plain;
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}