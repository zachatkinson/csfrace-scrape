# CSFrace Scrape - Development Docker Compose Configuration
# Optimized for local development with hot reloading and debugging

networks:
  csfrace-dev-network:
    driver: bridge

volumes:
  postgres-dev-data:
    driver: local
  redis-dev-data:
    driver: local
  uv-cache:
    driver: local
  prometheus-dev-data:
    driver: local
  grafana-dev-data:
    driver: local

services:
  # Backend - Development with hot reloading
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder  # Use builder stage for development with build tools
    ports:
      - "${BACKEND_PORT:-8000}:8000"
      - "5678:5678"  # Python debugger port (debugpy)
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=${BACKEND_LOG_LEVEL:-DEBUG}
      - SECRET_KEY=${SECRET_KEY:-development-secret-change-in-production}
      - RELOAD_ON_CHANGE=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-dev:5432/${POSTGRES_DB:-csfrace_dev}
      - REDIS_URL=${REDIS_URL:-redis://redis-dev:6379/0}
      - SCRAPER_CONCURRENT_REQUESTS=${SCRAPER_CONCURRENT_REQUESTS:-5}
      - SCRAPER_REQUEST_TIMEOUT=${SCRAPER_REQUEST_TIMEOUT:-30}
      - SCRAPER_MAX_RETRIES=${SCRAPER_MAX_RETRIES:-3}
      - ENABLE_CORS=true
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3002
      - ENABLE_DEBUG_TOOLBAR=true
      - PYTEST_TIMEOUT=60
      - UV_CACHE_DIR=/tmp/.uv-cache
      - PYTHONPATH=/build/src
      - UV_PROJECT_ENVIRONMENT=/usr/local
    volumes:
      # Mount source for hot reloading  
      - ./backend/src:/build/src:rw
      - ./backend/tests:/build/tests:rw
      - ./backend/pyproject.toml:/build/pyproject.toml:ro
      # Development output directories
      - ./dev-output:/build/output:rw
      - ./dev-logs:/build/logs:rw
      # UV cache directory with proper permissions
      - uv-cache:/tmp/.uv-cache
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    # Relaxed health check for development with curl
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 60s

  # Frontend - Development with hot reloading
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=${FRONTEND_API_URL:-http://localhost:8000}
      - REACT_APP_API_TIMEOUT=${FRONTEND_API_TIMEOUT:-30000}
      - REACT_APP_THEME=${FRONTEND_THEME:-light}
      - REACT_APP_MONITORING_ENABLED=true
      - FAST_REFRESH=true
      - CHOKIDAR_USEPOLLING=true  # For Windows/macOS file watching
    volumes:
      # Mount source for hot reloading
      - ./frontend/src:/app/src:rw
      - ./frontend/public:/app/public:rw
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:ro
      - ./frontend/astro.config.ts:/app/astro.config.ts:ro
    depends_on:
      backend:
        condition: service_started  # Don't wait for healthy in dev
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    # Relaxed health check for development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 60s

  # PostgreSQL - Development Database
  postgres-dev:
    image: postgres:17-alpine  # Keep consistent with production
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-csfrace_dev}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
      # Development: Enable debug logging and statistics
      - POSTGRES_SHARED_PRELOAD_LIBRARIES=pg_stat_statements
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./scripts/dev-init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      # Development: expose data directory for backup/restore
      - ./dev-backups:/backups:rw
    ports:
      - "${POSTGRES_PORT:-5432}:5432"  # Expose for external tools
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-csfrace_dev}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Development: optimized for debugging, smaller resources
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=100
      -c work_mem=8MB
      -c maintenance_work_mem=32MB
      -c log_statement=all
      -c log_min_duration_statement=100
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'
        reservations:
          memory: 256m
          cpus: '0.1'

  # Redis - Development Cache
  redis-dev:
    image: redis:7-alpine  # Keep consistent with production
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1000
    volumes:
      - redis-dev-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"  # Expose for external tools
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: '0.25'
        reservations:
          memory: 64m
          cpus: '0.05'

  # Prometheus - Development Monitoring
  prometheus-dev:
    image: prom/prometheus:v2.40.0  # Keep consistent with production
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-dev-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=7d'  # Shorter retention for dev
      - '--log.level=debug'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 128m
          cpus: '0.1'

  # Grafana - Development Dashboard
  grafana-dev:
    image: grafana/grafana:9.0.0  # Keep consistent with production
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true  # Allow anonymous in dev
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_LOG_LEVEL=debug
    volumes:
      - grafana-dev-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus-dev
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 128m
          cpus: '0.1'

  # pgAdmin - Development Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "8080:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
    depends_on:
      - postgres-dev
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    profiles:
      - tools

  # Redis Commander - Development Cache Management
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis-dev:6379
      - HTTP_USER=${REDIS_COMMANDER_USER:-admin}
      - HTTP_PASSWORD=${REDIS_COMMANDER_PASSWORD:-admin}
    depends_on:
      - redis-dev
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    profiles:
      - tools

  # Mailhog - Development Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    profiles:
      - tools

# Development-specific overrides
# Use: docker compose -f docker-compose.dev.yml up -d