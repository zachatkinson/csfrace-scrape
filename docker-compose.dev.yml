# CSFrace Scrape - Development Docker Compose Configuration
# Optimized for local development with hot reloading and debugging
# Following modern Docker Compose best practices

networks:
  csfrace-dev-network:
    driver: bridge

volumes:
  postgres-dev-data:
    driver: local
  redis-dev-data:
    driver: local
  uv-cache:
    driver: local
  prometheus-dev-data:
    driver: local
  grafana-dev-data:
    driver: local

services:
  # Backend - Development with hot reloading (DRY/SOLID: Fixed service name for development)
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder  # Use builder stage for development with build tools
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # Modern Docker Compose env_file configuration
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=true
      - LOG_LEVEL=${BACKEND_LOG_LEVEL:-DEBUG}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-not-for-production}
      - RELOAD_ON_CHANGE=true
      # DRY/SOLID: Use fixed service names for development 
      - REDIS_SERVICE_NAME=redis-dev
      - POSTGRES_SERVICE_NAME=postgres-dev
      - POSTGRES_DATABASE=${POSTGRES_DB:-csfrace_dev}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:dev-password@postgres-dev:5432/csfrace_dev}
      - REDIS_URL=${REDIS_URL:-redis://redis-dev:6379/0}
      - CACHE_BACKEND=redis
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - REDIS_DB=0
      - SCRAPER_CONCURRENT_REQUESTS=${SCRAPER_CONCURRENT_REQUESTS:-10}
      - SCRAPER_REQUEST_TIMEOUT=${SCRAPER_REQUEST_TIMEOUT:-30}
      - SCRAPER_MAX_RETRIES=${SCRAPER_MAX_RETRIES:-3}
      - ENABLE_CORS=${ENABLE_CORS:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - ENABLE_DEBUG_TOOLBAR=true
      # OAuth2 Configuration (DRY: from centralized .env)
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
      - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
      - OAUTH_MICROSOFT_CLIENT_ID=${OAUTH_MICROSOFT_CLIENT_ID:-your-microsoft-client-id}
      - OAUTH_MICROSOFT_CLIENT_SECRET=${OAUTH_MICROSOFT_CLIENT_SECRET:-your-microsoft-client-secret}
      - OAUTH_FACEBOOK_CLIENT_ID=${OAUTH_FACEBOOK_CLIENT_ID:-your-facebook-app-id}
      - OAUTH_FACEBOOK_CLIENT_SECRET=${OAUTH_FACEBOOK_CLIENT_SECRET:-your-facebook-app-secret}
      - OAUTH_APPLE_CLIENT_ID=${OAUTH_APPLE_CLIENT_ID:-your-apple-service-id}
      - OAUTH_APPLE_CLIENT_SECRET=${OAUTH_APPLE_CLIENT_SECRET:-your-apple-client-secret}
      - OAUTH_REDIRECT_URI_BASE=${OAUTH_REDIRECT_URI_BASE:-http://localhost:8000/auth}
      # WebAuthn Configuration (DRY: from centralized .env)
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-CSFrace Development}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost:8000}
      - PYTEST_TIMEOUT=60
      - UV_CACHE_DIR=/tmp/.uv-cache
      - PYTHONPATH=/build/src
      - UV_PROJECT_ENVIRONMENT=/usr/local
    volumes:
      # Mount source for hot reloading  
      - ./backend/src:/build/src:rw
      - ./backend/tests:/build/tests:rw
      - ./backend/pyproject.toml:/build/pyproject.toml:ro
      # Mount startup script with migrations
      - ./backend/start-dev.sh:/build/start-dev.sh:ro
      - ./backend/alembic:/build/alembic:ro
      - ./backend/alembic.ini:/build/alembic.ini:ro
      # Development output directories
      - ./dev-output:/build/output:rw
      - ./dev-logs:/build/logs:rw
      # UV cache directory with proper permissions
      - uv-cache:/tmp/.uv-cache
    # Override default command to use startup script
    command: ["bash", "/build/start-dev.sh"]
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    # DRY/SOLID: Health check using environment variables
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${BACKEND_PORT:-8000}${BACKEND_HEALTH_ENDPOINT:-/health}')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Frontend - Development with hot reloading (DRY/SOLID: Fixed service name for development)
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    # Modern Docker Compose env_file configuration
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      # DRY/SOLID: Use centralized URLs from .env (single source of truth)
      - VITE_API_URL=${FRONTEND_API_URL:-http://localhost:8000}
      - PUBLIC_API_URL=${FRONTEND_API_URL:-http://localhost:8000}
      - REACT_APP_API_URL=${FRONTEND_API_URL:-http://localhost:8000}
      # Server-side API URL for Docker internal networking
      - VITE_SERVER_API_URL=${FRONTEND_SERVER_API_URL:-http://backend-dev:8000}
      - REACT_APP_API_TIMEOUT=${FRONTEND_API_TIMEOUT:-30000}
      - REACT_APP_THEME=${FRONTEND_THEME:-light}
      - REACT_APP_MONITORING_ENABLED=true
      - FAST_REFRESH=true
      - CHOKIDAR_USEPOLLING=true  # For Windows/macOS file watching
    volumes:
      # Mount source for hot reloading
      - ./frontend/src:/app/src:rw
      - ./frontend/public:/app/public:rw
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:ro
      - ./frontend/astro.config.ts:/app/astro.config.ts:ro
    depends_on:
      backend-dev:
        condition: service_started  # Don't wait for healthy in dev
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    # DRY/SOLID: Health check using environment variables
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FRONTEND_PORT:-3000}${FRONTEND_HEALTH_ENDPOINT:-/}"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 60s

  # PostgreSQL - Development Database (DRY/SOLID: Fixed service name for development)
  postgres-dev:
    image: postgres:${POSTGRES_VERSION:-15-alpine}
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-csfrace_dev}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev-password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C --data-checksums
      # Development: Enable debug logging and statistics
      - POSTGRES_SHARED_PRELOAD_LIBRARIES=pg_stat_statements
    volumes:
      # Official recommendation: mount data to /var/lib/postgresql/data
      - postgres-dev-data:/var/lib/postgresql/data
      # Official recommendation: place init scripts in /docker-entrypoint-initdb.d/
      - ./scripts/dev-init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/init-extensions.sql:/docker-entrypoint-initdb.d/02-extensions.sql:ro
      # Development: expose data directory for backup/restore
      - ./dev-backups:/backups:rw
    ports:
      - "${POSTGRES_PORT:-5432}:5432"  # Expose for external tools
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    # DRY/SOLID: Health check using environment variables
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Development: optimized for debugging, smaller resources
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=100
      -c work_mem=8MB
      -c maintenance_work_mem=32MB
      -c log_statement=all
      -c log_min_duration_statement=100
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
      -c shared_preload_libraries=pg_stat_statements
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'
        reservations:
          memory: 256m
          cpus: '0.1'

  # Redis - Development Cache (DRY/SOLID: Fixed service name for development)
  redis-dev:
    image: redis:${REDIS_VERSION:-7-alpine}
    command: [
      "redis-server",
      "--appendonly", "yes",           # Enable AOF persistence
      "--maxmemory", "256mb",          # Set memory limit for development
      "--maxmemory-policy", "allkeys-lru",  # LRU eviction policy
      "--save", "60", "1000",          # RDB snapshot: save if 1000+ keys changed in 60s
      "--bind", "0.0.0.0",             # Bind to all interfaces
      "--protected-mode", "no",        # Disable for development (not recommended for production)
      "--tcp-keepalive", "60",         # TCP keepalive for better connection management
      "--timeout", "300"               # Client idle timeout (5 minutes)
    ]
    volumes:
      - redis-dev-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"  # Expose for external tools
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: '0.25'
        reservations:
          memory: 64m
          cpus: '0.05'

  # Prometheus - Development Monitoring (DRY/SOLID: Fixed service name for development)
  prometheus-dev:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.48.0}
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-dev-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=7d'  # Shorter retention for dev
      - '--log.level=debug'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      # Security: Restrict CORS following 2025 best practices (default is ".*" = allow all)
      - '--web.cors.origin=^$'  # Block all CORS origins for security (empty regex = no matches)
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PROMETHEUS_PORT}/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 128m
          cpus: '0.1'

  # Grafana - Development Dashboard (DRY/SOLID: Fixed service name for development)
  grafana-dev:
    image: grafana/grafana-enterprise:${GRAFANA_VERSION:-10.2.0}
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      # Security configuration following official best practices
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true  # Allow anonymous in dev
      # Plugin installation as recommended by official docs
      - GF_INSTALL_PLUGINS=${GRAFANA_DEV_PLUGINS:-grafana-piechart-panel,grafana-worldmap-panel}
      # Development logging
      - GF_LOG_LEVEL=debug
      - GF_SERVER_ROOT_URL=${GRAFANA_PUBLIC_URL:-http://localhost:3001}
    volumes:
      # Official recommendation: use named volumes for persistent storage
      - grafana-dev-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus-dev
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    # DRY/SOLID: Health check using environment variables  
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${GRAFANA_PORT}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 128m
          cpus: '0.1'

  # pgAdmin - Development Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "8080:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
    depends_on:
      - postgres-dev
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    profiles:
      - tools

  # Redis Commander - Development Cache Management
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis-dev:${REDIS_PORT:-6379}
      - HTTP_USER=${REDIS_COMMANDER_USER:-admin}
      - HTTP_PASSWORD=${REDIS_COMMANDER_PASSWORD:-admin}
    depends_on:
      - redis-dev
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    profiles:
      - tools

  # Mailhog - Development Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - csfrace-dev-network
    restart: unless-stopped
    profiles:
      - tools

# Development-specific overrides
# Use: docker compose -f docker-compose.dev.yml up -d